[package]
name = "pmt_ppmt_local_eval"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
oxfml-locale = ["dep:oxfml_core", "dep:sha2"]
depreciation-research = ["oxfunc_core/research-x87"]

[dependencies]
oxfunc_core = { path = "../../../crates/oxfunc_core" }
oxfml_core = { path = "../../../../OxFml/crates/oxfml_core", optional = true }
sha2 = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "pmt_ppmt_local_eval"
path = "src/main.rs"

[[bin]]
name = "expanded_finance_explorer"
path = "src/bin/expanded_finance_explorer.rs"

[[bin]]
name = "array_tranche_local_eval"
path = "src/bin/array_tranche_local_eval.rs"

[[bin]]
name = "broad_scalar_explorer"
path = "src/bin/broad_scalar_explorer.rs"

[[bin]]
name = "stat_distribution_explorer"
path = "src/bin/stat_distribution_explorer.rs"

[[bin]]
name = "matrix_local_eval"
path = "src/bin/matrix_local_eval.rs"

[[bin]]
name = "rand_characterize"
path = "src/bin/rand_characterize.rs"

[[bin]]
name = "depreciation_graph_explorer"
path = "src/bin/depreciation_graph_explorer.rs"
required-features = ["depreciation-research"]
