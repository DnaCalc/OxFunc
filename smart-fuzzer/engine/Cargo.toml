[package]
name = "sf"
version = "0.1.0"
edition = "2024"
publish = false
description = "W112 parity driver: the one engine over the ExcelParity ledger (docs/worksets/W112_PARITY_DRIVER_CONSOLIDATION.md)"

# Standalone, like calc_graph_racer: kept out of the main workspace so the engine never
# changes how the production crates build.
[workspace]

[lib]
name = "sf"
path = "src/lib.rs"

[[bin]]
name = "sf"
path = "src/main.rs"

[dependencies]
oxfunc_core = { path = "../../crates/oxfunc_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
