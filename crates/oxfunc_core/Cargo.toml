[package]
name = "oxfunc_core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "oxfunc_core"
path = "src/lib.rs"

[features]
# W109 research surface: exposes the raw x87 instruction primitives and the
# Ext80 extended-precision temporary type (excel_numeric::research) to the
# calculation-graph search tooling. Never enabled by production consumers.
research-x87 = []
# W110-2 (oxf-xvt5.2, default flipped on in oxf-xvt5.10): pass-through of
# `oxfunc_value_types/send-values` — `CalcValue: Send + Sync` via `Arc`
# payloads and `OpaqueCallable: Send + Sync`. On by default since 2026-09-15;
# `--no-default-features` selects the `Rc` arm, kept for one release only (see
# docs/handoffs/HANDOFF_OXFML_opaque_callable_send_sync.md, "Default flip", for
# the retirement condition). `research-x87` stays opt-in.
default = ["send-values"]
send-values = ["oxfunc_value_types/send-values"]

[dependencies]
libm = "0.2"
oxfunc_value_types = { path = "../oxfunc_value_types" }
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"

[dev-dependencies]
# test-support exposes oxfml_core::test_support::minimal (the minimal non-grid
# test reference profile/provider) for seam tests that need a reference to bind.
oxfml_core = { path = "../../../OxFml/crates/oxfml_core", features = ["test-support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
